name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate SSH Key Format
        run: |
          echo "🔍 Validando formato da chave SSH..."
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY não está configurado!"
            exit 1
          fi
          echo "✅ SSH_PRIVATE_KEY está configurado"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 300s
          script_stop: true
          debug: false
          use_insecure_cipher: false
          script: |
            set -e
            
            echo "🚀 Iniciando deploy..."
            cd /srv/backend
            
            # Carrega variáveis do .env se existir
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi
            
            # Atualiza código
            echo "📥 Atualizando código do repositório..."
            git fetch origin
            git pull origin ${{ github.ref_name }} || {
              echo "⚠️  Aviso: Falha no pull, tentando continuar..."
            }
            
            # Habilita BuildKit para cache e builds mais rápidos
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Garante que o script de deploy tenha permissão de execução
            chmod +x deploy.sh 2>/dev/null || true
            
            # Usa o script de deploy otimizado
            # O script faz: build, sobe serviços, aguarda DB, executa migrações, reinicia
            echo "🔨 Executando deploy automatizado..."
            SKIP_GIT_PULL=1 ./deploy.sh || {
              echo "❌ Deploy falhou!"
              echo ""
              echo "📋 Logs do backend:"
              docker compose logs --tail=50 backend || true
              echo ""
              echo "📋 Status dos containers:"
              docker compose ps || true
              exit 1
            }
            
            echo ""
            echo "✅ Deploy concluído com sucesso!"

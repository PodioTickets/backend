services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: podiogo-redis
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - podiogo-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Opcional no .env: NODE_MAX_OLD_SPACE_SIZE=2048 (máquinas com mais RAM)
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-768}
    container_name: podiogo-backend
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@34.95.198.14:5432/${POSTGRES_DB}?schema=public&connection_limit=20&pool_timeout=20
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3333:3333"
    volumes:
      # Persistir uploads (banner/logo dos eventos, avatares, PDFs) entre deploys/restarts
      - uploads_data:/usr/src/app/uploads
      - ./podio-storage-homolog-key.json:/usr/src/app/podio-storage-homolog-key.json:ro
    networks:
      - podiogo-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  podiogo-network:
    driver: bridge
